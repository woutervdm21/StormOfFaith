<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply theme before first paint to prevent flash -->
    <script>
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark')
      } else {
        document.documentElement.classList.add('dark')
      }
    </script>
    <link rel="icon" type="image/png" href="/img/Icons-01.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Storm of Faith | Graphic Designer &amp; Web Developer | Middelburg, South Africa</title>
    <meta name="description" content="Storm of Faith — professional graphic designer and web developer in Middelburg, South Africa. Custom logo design, brand identity, print design, and fully built websites. Contact Candice van der Merwe for a quote." />
    <meta name="keywords" content="graphic designer Middelburg, web developer Middelburg, logo design South Africa, website design Middelburg, brand identity designer, web development Mpumalanga, print design, business card design, Storm of Faith, Candice van der Merwe" />
    <meta name="author" content="Candice van der Merwe — Storm of Faith" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://stormoffaith.co.za/" />

    <!-- Geo / local SEO -->
    <meta name="geo.region" content="ZA-MP" />
    <meta name="geo.placename" content="Middelburg, Mpumalanga, South Africa" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stormoffaith.co.za/" />
    <meta property="og:title" content="Storm of Faith | Graphic Designer &amp; Web Developer | Middelburg" />
    <meta property="og:description" content="Custom logo design, brand identity, print design, and website development — handcrafted with faith and purpose in Middelburg, South Africa." />
    <meta property="og:image" content="https://stormoffaith.co.za/img/Storm Of Faith Logo HD-01.png" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Storm of Faith | Graphic Designer &amp; Web Developer | Middelburg" />
    <meta name="twitter:description" content="Custom logos, brand identity, print design &amp; websites — faith-driven creative studio in Middelburg, SA." />
    <meta name="twitter:image" content="https://stormoffaith.co.za/img/Storm Of Faith Logo HD-01.png" />

    <!-- Structured data: LocalBusiness + Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "LocalBusiness",
          "name": "Storm of Faith",
          "description": "Professional graphic design and web development studio based in Middelburg, South Africa. Services include logo design, brand identity, print design, website development, and digital marketing assets.",
          "url": "https://stormoffaith.co.za",
          "logo": "https://stormoffaith.co.za/img/Storm Of Faith Logo HD-01.png",
          "image": "https://stormoffaith.co.za/img/Storm Of Faith Logo HD-01.png",
          "telephone": "+27796499728",
          "email": "stormyvisions@yahoo.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Middelburg",
            "addressRegion": "Mpumalanga",
            "addressCountry": "ZA"
          },
          "areaServed": {
            "@type": "Country",
            "name": "South Africa"
          },
          "openingHours": "Mo-Fr 08:00-16:00",
          "sameAs": [
            "https://www.instagram.com/stormoffaith3_16",
            "https://web.facebook.com/profile.php?id=61575638911067"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Design & Development Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Logo Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brand Identity Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Print Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Digital Marketing Assets" } }
            ]
          }
        },
        {
          "@type": "Person",
          "name": "Candice van der Merwe",
          "jobTitle": "Graphic Designer & Web Developer",
          "worksFor": { "@type": "Organization", "name": "Storm of Faith" },
          "address": { "@type": "PostalAddress", "addressLocality": "Middelburg", "addressCountry": "ZA" }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- Netlify form detection for SPA -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
