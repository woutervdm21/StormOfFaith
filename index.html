<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply theme before first paint to prevent flash -->
    <script>
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark')
      } else {
        document.documentElement.classList.add('dark')
      }
    </script>
    <link rel="icon" type="image/png" href="/img/Icons-01.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storm Of Faith — Graphic & Web Design</title>
    <meta name="description" content="Storm Of Faith — graphic and web design studio based in Middelburg, South Africa. Specialising in logo design, print design, and digital assets. Handcrafted with faith and purpose." />
    <meta name="keywords" content="graphic design, logo design, print design, web design, Middelburg, South Africa" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Storm Of Faith — Graphic & Web Design" />
    <meta property="og:description" content="Custom logos, print, and digital design — handcrafted with faith and purpose in Middelburg, South Africa." />
    <meta property="og:image" content="/img/Storm Of Faith Logo HD-01.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Storm Of Faith — Graphic & Web Design" />
    <meta name="twitter:description" content="Custom logos, print, and digital design — handcrafted with faith and purpose." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- Netlify form detection for SPA -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
